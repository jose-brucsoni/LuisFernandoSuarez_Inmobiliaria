{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="Inicio de sesión - Acceso al panel de administración de Luis Fernando Suarez Brucsoni">
    <title>Inicio de Sesión | Luis Fernando Suarez Brucsoni - Inmobiliaria</title>
    
    <!-- iOS Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Iniciar Sesión">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--dim-grey) 0%, var(--text-dark) 50%, var(--primary-dark) 100%);
            padding: 2rem 0;
        }
        .login-header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        .login-header a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: opacity 0.3s ease;
        }
        .login-header a:hover {
            opacity: 0.9;
        }
        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-white);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: var(--shadow-xl);
        }
        .login-card .section-label {
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .login-card .section-title {
            margin-bottom: 0.5rem;
        }
        .login-card .section-subtitle {
            margin-bottom: 1.5rem;
        }
        .login-form .form-group {
            margin-bottom: 1.25rem;
        }
        .login-form .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            transition: var(--transition);
            min-height: 48px;
        }
        .login-form .form-group input:focus {
            outline: none;
            border-color: var(--scarlet-rush);
        }
        .login-form .btn-primary {
            width: 100%;
            justify-content: center;
            min-height: 48px;
            margin-top: 0.5rem;
        }
        .login-footer-links {
            text-align: center;
            margin-top: 1.5rem;
        }
        .login-footer-links a {
            color: var(--scarlet-rush);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .login-footer-links a:hover {
            text-decoration: underline;
        }
        .login-error {
            display: none;
            background: rgba(216, 72, 70, 0.15);
            color: var(--scarlet-rush);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(216, 72, 70, 0.3);
        }
        .login-error.show {
            display: block;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <header class="login-header">
            <a href="{% url 'inicio' %}" aria-label="Volver al inicio">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span>Luis Fernando Suarez Brucsoni</span>
            </a>
        </header>

        <section class="login-section">
            <div class="login-card">
                <span class="section-label">Acceso al panel</span>
                <h1 class="section-title">Inicio de sesión</h1>
                <p class="section-subtitle">Ingresa tus credenciales para acceder al panel de administración</p>

                <div class="login-error" id="loginError" role="alert">
                    Usuario o contraseña incorrectos. Intenta de nuevo.
                </div>

                <form class="login-form" id="loginForm" aria-label="Formulario de inicio de sesión" novalidate>
                    <div class="form-group">
                        <label for="usuario" class="sr-only">Usuario o correo electrónico</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Usuario o correo electrónico" required aria-required="true" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password" class="sr-only">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required aria-required="true" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" aria-label="Iniciar sesión">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Iniciar sesión
                    </button>
                </form>

                <div class="login-footer-links">
                    <a href="{% url 'inicio' %}">Volver al inicio</a>
                </div>
            </div>
        </section>
    </div>

    <script>
        (function() {
            var form = document.getElementById('loginForm');
            var errorEl = document.getElementById('loginError');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorEl.classList.remove('show');

                var usuario = document.getElementById('usuario').value.trim();
                var password = document.getElementById('password').value;

                if (!usuario || !password) {
                    errorEl.textContent = 'Completa usuario y contraseña.';
                    errorEl.classList.add('show');
                    return;
                }

                // Validación básica: permite acceso para redirigir al Panel.
                // En producción esto debe validarse en el servidor.
                sessionStorage.setItem('panelSession', 'true');
                window.location.href = '/templates/Panel.html';
            });
        })();
    </script>
</body>
</html>
